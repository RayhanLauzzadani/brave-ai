services:
  caddy:
    image: caddy:2-alpine
    container_name: brave-ai-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      APP_HOST: ${APP_HOST:-brave-ai.web.id}
    volumes:
      - ./deploy:/etc/caddy:ro
      - brave_caddy_data:/data
      - brave_caddy_config:/config
    depends_on:
      - frontend
      - api

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        BACKEND_ORIGIN: http://api:8000
        LAN_HOST: ${APP_HOST:-brave-ai.web.id}
        NEXT_PUBLIC_MEDIA_HLS_BASE_URL: https://${APP_HOST:-brave-ai.web.id}/hls
        NEXT_PUBLIC_MEDIA_PLAYBACK_BASE_URL: https://${APP_HOST:-brave-ai.web.id}/playback
        NEXT_PUBLIC_MEDIA_WEBRTC_BASE_URL: https://${APP_HOST:-brave-ai.web.id}/webrtc
        NEXT_PUBLIC_DEMO_INCIDENTS_ENABLED: ${NEXT_PUBLIC_DEMO_INCIDENTS_ENABLED:-false}
    container_name: brave-ai-frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      BACKEND_ORIGIN: http://api:8000
      LAN_HOST: ${APP_HOST:-brave-ai.web.id}
      NEXT_PUBLIC_MEDIA_HLS_BASE_URL: https://${APP_HOST:-brave-ai.web.id}/hls
      NEXT_PUBLIC_MEDIA_PLAYBACK_BASE_URL: https://${APP_HOST:-brave-ai.web.id}/playback
      NEXT_PUBLIC_MEDIA_WEBRTC_BASE_URL: https://${APP_HOST:-brave-ai.web.id}/webrtc
      NEXT_PUBLIC_DEMO_INCIDENTS_ENABLED: ${NEXT_PUBLIC_DEMO_INCIDENTS_ENABLED:-false}
    depends_on:
      - api

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: brave-ai-api
    restart: unless-stopped
    environment:
      APP_NAME: BRAVE AI API
      ENVIRONMENT: production
      API_PREFIX: /api
      DATABASE_URL: postgresql+asyncpg://brave:${POSTGRES_PASSWORD}@postgres:5432/brave_ai
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: '["https://${APP_HOST:-brave-ai.web.id}","http://${APP_HOST:-brave-ai.web.id}","http://148.230.103.197"]'
      MEDIA_HLS_BASE_URL: https://${APP_HOST:-brave-ai.web.id}/hls
      MEDIA_HLS_PROBE_BASE_URL: http://mediamtx:8888
      MEDIA_PROBE_TIMEOUT_SECONDS: 5
      MEDIA_RECORDINGS_DIR: /recordings
      MEDIA_RECORD_SEGMENT_DURATION_SECONDS: 60
      MEDIA_RECORD_MIN_FILE_SIZE_BYTES: 65536
      MEDIA_ARCHIVE_DIR: /archives
      MEDIA_CLIPS_DIR: /clips
      EVIDENCE_CLIP_MAX_DURATION_SECONDS: 600
      EVIDENCE_CLIP_FFMPEG_TIMEOUT_SECONDS: 180
      EVIDENCE_CLIP_SOURCE_WAIT_SECONDS: 120
      EVIDENCE_CLIP_GAP_TOLERANCE_SECONDS: 1
      EVIDENCE_CLIP_OUTPUT_DURATION_TOLERANCE_SECONDS: 2
      EVIDENCE_CLIP_RETENTION_DAYS: ${EVIDENCE_CLIP_RETENTION_DAYS:-7}
      EVIDENCE_CLIP_CLEANUP_POLL_SECONDS: ${EVIDENCE_CLIP_CLEANUP_POLL_SECONDS:-3600}
      FFMPEG_BINARY: ffmpeg
      FFPROBE_BINARY: ffprobe
      FFPROBE_TIMEOUT_SECONDS: 30
      SECRET_KEY: ${SECRET_KEY}
      INCIDENT_INGEST_TOKEN: ${INCIDENT_INGEST_TOKEN:-}
      ACCESS_TOKEN_EXPIRE_MINUTES: 1440
      SESSION_COOKIE_NAME: brave_session
      SEED_ADMIN_EMAIL: admin@braveai.school
      SEED_ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      SEED_VIEWER_EMAIL: gurubk@braveai.school
      SEED_VIEWER_PASSWORD: ${VIEWER_PASSWORD}
    volumes:
      - ./media/recordings:/recordings:ro
      - ./media/archives:/archives:ro
      - ./media/clips:/clips
    depends_on:
      - postgres
      - redis

  recording-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: brave-ai-recording-worker
    restart: unless-stopped
    command: python -m app.workers.recording_archiver
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql+asyncpg://brave:${POSTGRES_PASSWORD}@postgres:5432/brave_ai
      MEDIA_RECORDINGS_DIR: /recordings
      MEDIA_RECORD_SEGMENT_DURATION_SECONDS: 60
      MEDIA_RECORD_MIN_FILE_SIZE_BYTES: 65536
      MEDIA_ARCHIVE_DIR: /archives
      MEDIA_HLS_PROBE_BASE_URL: http://mediamtx:8888
      RECORDING_SESSION_DURATION_SECONDS: ${RECORDING_SESSION_DURATION_SECONDS:-86400}
      RECORDING_ARCHIVE_RETENTION_DAYS: ${RECORDING_ARCHIVE_RETENTION_DAYS:-7}
      RECORDING_ARCHIVE_POLL_SECONDS: ${RECORDING_ARCHIVE_POLL_SECONDS:-60}
      RECORDING_ARCHIVE_GAP_TOLERANCE_SECONDS: ${RECORDING_ARCHIVE_GAP_TOLERANCE_SECONDS:-10}
      RECORDING_ARCHIVE_OUTPUT_DURATION_TOLERANCE_SECONDS: ${RECORDING_ARCHIVE_OUTPUT_DURATION_TOLERANCE_SECONDS:-10}
      RECORDING_ARCHIVE_FFMPEG_TIMEOUT_SECONDS: ${RECORDING_ARCHIVE_FFMPEG_TIMEOUT_SECONDS:-21600}
      RECORDING_ARCHIVE_VIDEO_CRF: ${RECORDING_ARCHIVE_VIDEO_CRF:-30}
      RECORDING_ARCHIVE_VIDEO_FPS: ${RECORDING_ARCHIVE_VIDEO_FPS:-12}
      RECORDING_ARCHIVE_VIDEO_PRESET: ${RECORDING_ARCHIVE_VIDEO_PRESET:-veryfast}
      RECORDING_ARCHIVE_VIDEO_MAX_WIDTH: ${RECORDING_ARCHIVE_VIDEO_MAX_WIDTH:-960}
      RECORDING_ARCHIVE_VIDEO_MAX_HEIGHT: ${RECORDING_ARCHIVE_VIDEO_MAX_HEIGHT:-540}
      RECORDING_ARCHIVE_VIDEO_MAX_BITRATE_KBPS: ${RECORDING_ARCHIVE_VIDEO_MAX_BITRATE_KBPS:-900}
      RECORDING_ARCHIVE_AUDIO_BITRATE_KBPS: ${RECORDING_ARCHIVE_AUDIO_BITRATE_KBPS:-48}
      FFMPEG_BINARY: ffmpeg
      FFPROBE_BINARY: ffprobe
      FFPROBE_TIMEOUT_SECONDS: 30
    volumes:
      - ./media/recordings:/recordings:ro
      - ./media/archives:/archives
    depends_on:
      - postgres
      - mediamtx

  ai-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: brave-ai-ai-worker
    restart: unless-stopped
    command: python -m app.workers.gemini_detection
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql+asyncpg://brave:${POSTGRES_PASSWORD}@postgres:5432/brave_ai
      REDIS_URL: redis://redis:6379/0
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL_NAME: ${GEMINI_MODEL_NAME:-gemini-3.1-flash-lite}
      GEMINI_VIDEO_FPS: ${GEMINI_VIDEO_FPS:-10}
      AI_DETECTION_ENABLED: ${AI_DETECTION_ENABLED:-false}
      AI_DETECTION_INTERVAL_SECONDS: ${AI_DETECTION_INTERVAL_SECONDS:-3}
      AI_DETECTION_CONFIDENCE_THRESHOLD: ${AI_DETECTION_CONFIDENCE_THRESHOLD:-0.75}
      AI_DETECTION_COOLDOWN_SECONDS: ${AI_DETECTION_COOLDOWN_SECONDS:-30}
      AI_DETECTION_MAX_CONCURRENCY: ${AI_DETECTION_MAX_CONCURRENCY:-1}
      AI_DETECTION_RTSP_BASE_URL: rtsp://mediamtx:8554
      INCIDENT_API_BASE_URL: http://api:8000/api
      INCIDENT_REQUEST_MAX_ATTEMPTS: ${INCIDENT_REQUEST_MAX_ATTEMPTS:-4}
      INCIDENT_REQUEST_RETRY_BASE_SECONDS: ${INCIDENT_REQUEST_RETRY_BASE_SECONDS:-0.5}
      INCIDENT_INGEST_TOKEN: ${INCIDENT_INGEST_TOKEN:-}
    depends_on:
      - api
      - mediamtx
      - postgres
      - redis

  mediamtx:
    image: bluenviron/mediamtx:latest
    container_name: brave-ai-mediamtx
    restart: unless-stopped
    ports:
      - "8554:8554"
      - "8888:8888"
      - "8889:8889"
      - "8189:8189" # WebRTC ICE TCP fallback
      - "8189:8189/udp"
      - "9996:9996"
      - "9997:9997"
    volumes:
      - ./media:/media:ro
      - ./media/recordings:/recordings
      - brave_hls_data:/hls
    command: /media/mediamtx.yml

  postgres:
    image: postgres:16-alpine
    container_name: brave-ai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: brave_ai
      POSTGRES_USER: brave
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - brave_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: brave-ai-redis
    restart: unless-stopped
    volumes:
      - brave_redis_data:/data

volumes:
  brave_postgres_data:
  brave_redis_data:
  brave_hls_data:
  brave_caddy_data:
  brave_caddy_config:
